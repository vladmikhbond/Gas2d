<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="./index.css" />
        <link rel="icon" href="./favicon.ico" type="image/x-icon">
		<link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">
    </head>
<body>
    <h3 id="page-title">Ideal Gas</h3>
    
    <div>
        <span class="states-cont">
            <label><input type="radio" name="states" value="Balls" id="balls">Gas</label>
            <label><input type="radio" name="states" value="Lines" id="lines">Walls</label>
            <label><input type="radio" name="states" value="None" id="none">Devices</label>
        </span>
        
        <input id="options-glo" value="g = 0.1, gBall = 0, cell = 20, viz = 10, quant = 5, metr = 10">
    </div>

    <span id="confirm"></span>

    <div>
        <span class="kinds-cont">
            <label>
                <input type="radio" name="kinds" value="kind0" id="kind-radio0" checked><span id="kind-span0"></span>
            </label>
            <label>
                <input type="radio" name="kinds" value="kind1" id="kind-radio1"><span id="kind-span1"></span>
            </label>
            <label>
                <input type="radio" name="kinds" value="kind2" id="kind-radio2"><span id="kind-span2"></span>
            </label>  
        </span>

        <input id="options-new" >
        <button id="pause-process-btn" class="command" title="Play-Pause">►</button>
        <button id="step" class="command" title="One Step">1</button>
        <button id="help" class="command" onclick="window.open('help.html');">Help</button>
    </div>
    <div> 
        <textarea id="process-script" spellcheck="false" title="Вікно команд">
load: Norm
run:             
        </textarea>
    </div>

    <canvas id="canvas" width="400" height="500" tabindex="0"></canvas>
    
    <div class="footer">
        <span id="footer"></span>
        <span id="footer2"></span>        
    </div>   
    
    <div> 
        <input id="image-json" />
    </div>

    <textarea id="db" spellcheck="false">    </textarea>  
    <script type="module" src="main.js"></script>

</body>
</html>
